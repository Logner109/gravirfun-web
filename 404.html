<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka sa nenašla | GravirFun</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ff6a00">
  <style>
    /* Štýly sú vložené priamo, aby stránka 404 fungovala na akejkoľvek adrese. */
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2a36;
      background: radial-gradient(900px 500px at 85% 10%, #fff1e6 0%, rgba(255, 241, 230, 0) 60%), #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    .big { font-size: clamp(5rem, 15vw, 9rem); font-weight: 800; line-height: 1; color: #fc5d09; letter-spacing: -.04em; margin: 0; }
    h1 { color: #141f2b; font-size: clamp(1.5rem, 3vw, 2rem); margin: 1rem 0 .5rem; }
    p { color: #5f6b7a; margin: 0 0 2rem; }
    a.btn {
      display: inline-block;
      color: #fff;
      background: linear-gradient(180deg, #ff8a1f 0%, #fc5d09 100%);
      text-decoration: none;
      font-weight: 600;
      padding: .85rem 1.7rem;
      border-radius: .8rem;
      box-shadow: 0 8px 20px rgba(252, 93, 9, .28);
    }
    img { height: 40px; width: auto; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div>
    <img id="logo" src="assets/img/logo-nav.png" alt="GravirFun" onerror="this.style.display='none'">
    <p class="big">404</p>
    <h1>Takúto stránku sme ešte nevygravírovali</h1>
    <p>Adresa neexistuje alebo bola presunutá.</p>
    <a id="home" class="btn" href="./">Späť na úvod</a>
  </div>
  <script>
    // Stránka 404 sa zobrazuje na ľubovoľnej ceste – odkazy preto smerujú na koreň webu.
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      var root = p.indexOf('/gravirfun-web/') === 0 ? '/gravirfun-web/' : '/';
      document.getElementById('home').href = root;
      document.getElementById('logo').src = root + 'assets/img/logo-nav.png';
    })();
  </script>
</body>
</html>
